<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>lore</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161a22; --panel-2: #1c212b; --line: #262c38;
    --text: #e6e8ee; --muted: #8b93a7; --accent: #7c9cff; --accent-bg: #7c9cff1f;
    --ok: #4ade80; --danger: #f87171; --warn: #fbbf24;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .proj:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { display: grid; grid-template-columns: 260px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 18px 18px 12px; font-size: 18px; font-weight: 650; letter-spacing: .2px; }
  .label { padding: 8px 18px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  nav { overflow-y: auto; padding: 0 8px 8px; flex: 1; }
  .proj { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; color: var(--muted); }
  .proj:hover { background: var(--panel-2); color: var(--text); }
  .proj[aria-current="true"] { background: var(--accent-bg); color: var(--text); }
  .proj .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj.add { color: var(--accent); margin-top: 6px; }
  .badge { flex: none; min-width: 20px; padding: 0 6px; border-radius: 10px; font-size: 11px; line-height: 18px; text-align: center; background: var(--warn); color: #1a1405; font-weight: 600; }
  .side-foot { padding: 10px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .head { padding: 20px 28px 0; }
  .head h1 { margin: 0; font-size: 20px; font-weight: 650; }
  .head .root { margin-top: 2px; color: var(--muted); font: 12px var(--mono); overflow-wrap: anywhere; }
  .tabs { display: flex; gap: 4px; padding: 16px 28px 0; border-bottom: 1px solid var(--line); }
  .tabs:empty { display: none; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tab .c { margin-left: 6px; color: var(--muted); font-size: 12px; }
  .bar { display: flex; gap: 10px; align-items: center; padding: 14px 28px; }
  .bar:empty { display: none; }
  .bar input { flex: 1; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .bar .sp { flex: 1; }
  .list { flex: 1; overflow-y: auto; padding: 18px 28px 28px; display: flex; flex-direction: column; gap: 10px; }
  .bar:not(:empty) + .list { padding-top: 0; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: start; }
  .card .text { overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .chip { font: 11px var(--mono); padding: 1px 7px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); overflow-wrap: anywhere; }
  .chip.scope { color: var(--accent); border-color: #7c9cff44; }
  .chip.ok { color: var(--ok); border-color: #4ade8055; }
  .chip.bad { color: var(--danger); border-color: #f8717155; }
  .evidence { overflow-wrap: anywhere; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 4px 11px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: #3a4256; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b1020; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--danger); }
  .btn.danger.sure { background: var(--danger); border-color: var(--danger); color: #1b0808; font-weight: 600; }
  .btn.warn.sure { background: var(--warn); border-color: var(--warn); color: #1a1405; font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }

  .edit { grid-column: 1 / -1; display: grid; gap: 8px; }
  .edit textarea, .edit input, .edit select, .fld input, .fld textarea, .fld select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; }
  .edit select { width: auto; padding: 4px 8px; }
  .edit textarea { min-height: 72px; }
  .edit input { font-family: var(--mono); font-size: 12.5px; }
  .edit .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .edit .hint { color: var(--muted); font-size: 12px; margin-right: auto; }
  .err { color: var(--danger); font-size: 12.5px; }

  .tool, .form { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
  .form { max-width: 640px; }
  .tool h3, .form h2 { margin: 0; font-size: 15px; font-weight: 650; }
  .form h2 { font-size: 18px; }
  .tool p, .form p { margin: 0; color: var(--muted); font-size: 13px; }
  .fld { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .fld input, .fld select { font-size: 13px; }
  .fld input.mono, .fld textarea.mono { font-family: var(--mono); font-size: 12.5px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .check { display: inline-flex; gap: 6px; align-items: center; color: var(--text); font-size: 13px; cursor: pointer; }
  .check input { width: auto; accent-color: var(--accent); }
  .out { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); overflow: hidden; }
  .out-head { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .out-head .cmd { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .out pre { margin: 0; padding: 10px; max-height: 340px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 var(--mono); }
  .out .run { padding: 10px; color: var(--muted); }

  .empty { margin: 40px auto; max-width: 460px; text-align: center; color: var(--muted); }
  .empty code { font-family: var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--text); }
  #toast { position: fixed; right: 20px; bottom: 20px; background: var(--panel-2); border: 1px solid var(--danger); color: var(--text); padding: 10px 14px; border-radius: 10px; max-width: 360px; display: none; }
  #toast.good { border-color: var(--ok); }

  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; }
    .head, .tabs, .bar, .list { padding-left: 16px; padding-right: 16px; }
    .card { grid-template-columns: 1fr; }
    .actions { justify-content: flex-start; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">lore</div>
    <div class="label">Projects</div>
    <nav id="projects" aria-label="Projects"></nav>
    <div class="side-foot" id="foot"></div>
  </aside>
  <main>
    <div class="head" id="head"></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="bar" id="bar"></div>
    <div class="list" id="list"></div>
  </main>
</div>
<div id="toast" role="alert"></div>

<script>
"use strict";
// All rule text and script output is untrusted (it may come from docs, code or the agent):
// it is only ever inserted with textContent, never as HTML.
const $ = (id) => document.getElementById(id);
const h = (tag, props = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
};
const enc = encodeURIComponent;

let token = null;
try {
  token = new URLSearchParams(location.search).get("t") || sessionStorage.getItem("lore-token");
  if (token) sessionStorage.setItem("lore-token", token);
} catch (_) { token = new URLSearchParams(location.search).get("t"); }
if (location.search) history.replaceState(null, "", location.pathname);   // keep the token out of the address bar

const group = (v) => ({ v, out: null, running: false });
const freshTools = () => ({
  discover: group({ minRatio: "0.9", minFiles: "5" }),
  train: group({ path: "", scope: "", pending: false, dryRun: false }),
  resolve: group({ paths: "" }),
  project: group({}),
});
const state = {
  projects: [], current: null, data: null, view: "project",           // view: project | register
  tab: "pending",                                                       // pending | active | tools
  q: "", editing: null, adding: false, newRule: { text: "", scope: "global", status: "active", error: "" },
  sure: null, armedAt: 0, tools: freshTools(),
  register: group({ path: "", name: "", noImport: false }),
};

async function api(method, path, body) {
  const res = await fetch(path, {
    method, cache: "no-store",
    headers: { "X-Lore-Token": token || "", ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error((data && data.error) || `HTTP ${res.status}`);
  return data;
}

let toastTimer;
function toast(msg, good = false) {
  const t = $("toast");
  t.textContent = msg; t.className = good ? "good" : ""; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.style.display = "none"), 4500);
}
const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message); } };

// Two-step confirmation for destructive/bulk buttons: first click arms, a second click (not an accidental
// double-click) confirms, and it disarms by itself after a few seconds.
function arm(key) {
  state.sure = key; state.armedAt = Date.now(); renderMain();
  setTimeout(() => { if (state.sure === key) { state.sure = null; renderMain(); } }, 3500);
}
const confirmed = (key) => state.sure === key && Date.now() - state.armedAt > 350;
const twoStep = (key, fn) => guard(async () => {
  if (!confirmed(key)) { if (state.sure !== key) arm(key); return; }
  state.sure = null; await fn();
});

// ---------- data ----------
async function loadProjects() {
  state.projects = await api("GET", "/api/projects");
  if (!state.projects.some((p) => p.name === state.current)) { state.current = null; state.data = null; }
  if (!state.current && state.projects.length && state.view === "project") await select(state.projects[0].name);
  else renderAll();
}
async function loadRules() { state.data = await api("GET", `/api/projects/${enc(state.current)}/rules`); }
async function select(name) {
  state.current = name; state.view = "project"; state.q = ""; state.editing = null; state.adding = false; state.sure = null;
  state.tools = freshTools();
  await loadRules();
  state.tab = state.data.rules.some((r) => r.status === "pending") ? "pending" : "active";
  renderAll();
}
async function refresh() {
  await loadRules();
  state.projects = await api("GET", "/api/projects");
  renderAll();
}
const act = (rule, body) => api("POST", `/api/projects/${enc(state.current)}/rules/${rule.id}`, body);

// ---------- small form helpers (values live in state so re-renders keep them) ----------
function field(label, control, cls = "") { return h("label", { class: "fld " + cls }, h("span", {}, label), control); }
function textInput(g, key, { placeholder = "", mono = true, type = "text", label } = {}) {
  const el = h("input", { type, placeholder, spellcheck: "false", "aria-label": label, class: mono ? "mono" : "" });
  el.value = g.v[key]; el.addEventListener("input", () => (g.v[key] = el.value));
  return el;
}
function checkbox(g, key, label) {
  const el = h("input", { type: "checkbox" });
  el.checked = !!g.v[key]; el.addEventListener("change", () => (g.v[key] = el.checked));
  return h("label", { class: "check" }, el, label);
}
function outputBox(g) {
  if (g.running) return h("div", { class: "out" }, h("div", { class: "run" }, "Running…"));
  const o = g.out;
  if (!o) return null;
  return h("div", { class: "out" },
    h("div", { class: "out-head" }, h("span", { class: "chip " + (o.ok ? "ok" : "bad") }, o.ok ? "ok" : `failed (${o.code})`),
      h("span", { class: "cmd", title: o.command }, o.command), h("span", {}, `${o.seconds}s`)),
    h("pre", {}, o.output || "(no output)"));
}

// ---------- render ----------
function renderAll() { renderSide(); renderMain(); }

function renderSide() {
  const nav = $("projects");
  nav.replaceChildren(
    ...state.projects.map((p) =>
      h("button", { class: "proj", "aria-current": String(state.view === "project" && p.name === state.current), title: p.root,
        "aria-label": p.pending ? `${p.name}, ${p.pending} pending` : p.name, onclick: guard(() => select(p.name)) },
        h("span", { class: "n" }, p.name),
        p.pending ? h("span", { class: "badge", title: `${p.pending} pending` }, String(p.pending)) : null)),
    h("button", { class: "proj add", "aria-current": String(state.view === "register"), onclick: () => { state.view = "register"; renderAll(); } }, "+ Add project"));
  $("foot").textContent = `${state.projects.length} project${state.projects.length === 1 ? "" : "s"}`;
}

function renderMain() {
  if (state.view === "register") return renderRegister();
  const d = state.data;
  if (!d) return renderEmpty();
  const all = d.rules, active = all.filter((r) => r.status === "active"), pending = all.filter((r) => r.status === "pending");

  $("head").replaceChildren(h("h1", {}, d.name), h("div", { class: "root" }, d.root));
  const tabs = [["pending", "Pending", String(pending.length)], ["active", "Approved", String(active.length)], ["tools", "Tools", ""]];
  $("tabs").replaceChildren(...tabs.map(([key, label, n]) =>
    h("button", { class: "tab", role: "tab", "aria-selected": String(state.tab === key),
      onclick: () => { state.tab = key; state.editing = null; state.adding = false; state.sure = null; renderMain(); } },
      label, n ? h("span", { class: "c" }, n) : null)));

  if (state.tab === "tools") { $("bar").replaceChildren(); return renderTools(); }

  const visible = () => {
    const q = state.q.trim().toLowerCase();
    return (state.tab === "pending" ? pending : active).filter((r) => !q || (r.text + " " + r.scope + " " + r.source).toLowerCase().includes(q));
  };
  const search = h("input", { type: "search", placeholder: "Filter rules…", value: state.q, "aria-label": "Filter rules",
    oninput: (e) => { state.q = e.target.value; renderList(visible()); } });
  const bar = [search,
    h("button", { class: "btn", onclick: () => { state.adding = true; state.editing = null; state.newRule = { text: "", scope: "global", status: state.tab, error: "" }; renderMain(); } }, "+ Add rule"),
    h("span", { class: "sp" })];
  if (state.tab === "pending" && pending.length) {
    const key = "all";
    bar.push(h("button", { class: "btn primary", onclick: twoStep(key, async () => {
      for (const r of visible()) await act(r, { action: "approve" });
      await refresh();
    }) }, state.sure === key ? `Really approve ${visible().length}?` : state.q.trim() ? "Approve shown" : "Approve all"));
  }
  $("bar").replaceChildren(...bar);
  renderList(visible());
}

function renderList(rows) {
  const kids = [];
  if (state.adding) kids.push(newRuleForm());
  if (!rows.length && !state.adding) {
    kids.push(h("div", { class: "empty" }, state.q ? "No rules match the filter."
      : state.tab === "pending" ? "Nothing waiting for review."
      : "No approved rules yet. Approve some from the Pending tab, or add one."));
  }
  kids.push(...rows.map(card));
  $("list").replaceChildren(...kids);
}

function card(r) {
  if (state.editing === r.id) return editor(r);
  const key = `rm:${r.id}`;
  const actions = [];
  if (r.status === "pending") actions.push(h("button", { class: "btn primary", onclick: guard(async () => { await act(r, { action: "approve" }); await refresh(); }) }, "Approve"));
  actions.push(h("button", { class: "btn", onclick: () => { state.editing = r.id; state.adding = false; state.sure = null; renderMain(); } }, "Edit"));
  if (r.status === "active") actions.push(h("button", { class: "btn", onclick: guard(async () => { await act(r, { action: "unapprove" }); await refresh(); }) }, "Unapprove"));
  actions.push(h("button", { class: "btn danger" + (state.sure === key ? " sure" : ""),
    onclick: twoStep(key, async () => { await act(r, { action: "remove" }); await refresh(); }) },
    state.sure === key ? "Delete for good?" : r.status === "pending" ? "Reject" : "Delete"));

  return h("article", { class: "card" },
    h("div", {},
      h("div", { class: "text" }, r.text),
      h("div", { class: "meta" },
        h("span", { class: "chip scope" }, r.scope),
        r.source ? h("span", { class: "chip" }, r.source) : null,
        r.evidence ? h("span", { class: "evidence" }, r.evidence) : null)),
    h("div", { class: "actions" }, actions));
}

function scopeList() {
  return h("datalist", { id: "scopes" }, ["global", ...state.data.sections.map((s) => `section:${s}`)].map((v) => h("option", { value: v })));
}
const SCOPE_HINT = "Scope: global · section:<name> · glob:<pattern>   ·   Ctrl+Enter saves, Esc cancels";

function editor(r) {
  const ta = h("textarea", { "aria-label": "Rule text" }); ta.value = r.text;
  const sc = h("input", { "aria-label": "Scope", list: "scopes", spellcheck: "false" }); sc.value = r.scope;
  const err = h("div", { class: "err" });
  const save = guard(async () => {
    err.textContent = "";
    try { await act(r, { action: "edit", text: ta.value, scope: sc.value.trim() }); }
    catch (e) { err.textContent = e.message; return; }
    state.editing = null; await refresh();
  });
  const cancel = () => { state.editing = null; renderMain(); };
  const keys = (e) => { if (e.key === "Escape") cancel(); else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) save(); };
  ta.addEventListener("keydown", keys); sc.addEventListener("keydown", keys);
  setTimeout(() => ta.focus(), 0);
  return h("article", { class: "card" }, h("div", { class: "edit" },
    ta, sc, scopeList(), err,
    h("div", { class: "row" }, h("span", { class: "hint" }, SCOPE_HINT),
      h("button", { class: "btn", onclick: cancel }, "Cancel"), h("button", { class: "btn primary", onclick: save }, "Save"))));
}

function newRuleForm() {
  const n = state.newRule;
  const ta = h("textarea", { "aria-label": "New rule text", placeholder: "One short, concrete, imperative sentence, e.g. “Use the repository layer for DB access.”" });
  ta.value = n.text; ta.addEventListener("input", () => (n.text = ta.value));
  const sc = h("input", { "aria-label": "Scope", list: "scopes", spellcheck: "false" });
  sc.value = n.scope; sc.addEventListener("input", () => (n.scope = sc.value));
  const st = h("select", { "aria-label": "Status" }, h("option", { value: "active" }, "Approved"), h("option", { value: "pending" }, "Pending"));
  st.value = n.status; st.addEventListener("change", () => (n.status = st.value));
  const err = h("div", { class: "err" }, n.error);
  const add = guard(async () => {
    n.error = ""; err.textContent = "";
    let res;
    try { res = await api("POST", `/api/projects/${enc(state.current)}/rules`, { text: n.text, scope: n.scope.trim() || "global", status: n.status }); }
    catch (e) { n.error = e.message; err.textContent = e.message; return; }
    if (res.outcome === "duplicate") { n.error = `Already known as rule ${res.rule.id} (${res.rule.status}); nothing added.`; err.textContent = n.error; return; }
    state.adding = false; state.tab = res.rule.status; toast("Rule added", true); await refresh();
  });
  const cancel = () => { state.adding = false; renderMain(); };
  const keys = (e) => { if (e.key === "Escape") cancel(); else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) add(); };
  ta.addEventListener("keydown", keys); sc.addEventListener("keydown", keys);
  setTimeout(() => ta.focus(), 0);
  return h("article", { class: "card" }, h("div", { class: "edit" },
    ta, sc, scopeList(), err,
    h("div", { class: "row" }, h("span", { class: "hint" }, SCOPE_HINT), st,
      h("button", { class: "btn", onclick: cancel }, "Cancel"), h("button", { class: "btn primary", onclick: add }, "Add rule"))));
}

// ---------- tools: every script, from the page ----------
async function runTool(g, tool, params) {
  g.running = true; g.out = null; renderMain();
  try { g.out = await api("POST", `/api/projects/${enc(state.current)}/run`, { tool, params }); }
  catch (e) { g.out = { ok: false, code: -1, command: "", output: e.message, seconds: 0 }; }
  g.running = false;
  await refresh();                      // rules and counts may have changed
}

function renderTools() {
  const T = state.tools, enabled = (g) => !g.running;

  const discover = h("section", { class: "tool" },
    h("h3", {}, "Discover conventions"), h("p", {}, "Infer rules from this project's code and config (discover.py). Preview first; saving adds them for review."),
    h("div", { class: "fields" },
      field("Min. share of files (0.5–1)", textInput(T.discover, "minRatio", { type: "number", mono: false, label: "Minimum ratio" })),
      field("Min. files of evidence", textInput(T.discover, "minFiles", { type: "number", mono: false, label: "Minimum files" }))),
    h("div", { class: "row" },
      h("button", { class: "btn primary", disabled: !enabled(T.discover), onclick: guard(() => runTool(T.discover, "discover", { mode: "preview", ...T.discover.v })) }, "Preview"),
      h("button", { class: "btn", disabled: !enabled(T.discover), onclick: guard(() => runTool(T.discover, "discover", { mode: "save", ...T.discover.v })) }, "Save as pending"),
      h("button", { class: "btn warn" + (state.sure === "disc" ? " sure" : ""), disabled: !enabled(T.discover),
        onclick: twoStep("disc", () => runTool(T.discover, "discover", { mode: "activate", ...T.discover.v })) },
        state.sure === "disc" ? "Really save & approve?" : "Save & approve")),
    outputBox(T.discover));

  const train = h("section", { class: "tool" },
    h("h3", {}, "Train on instruction files"), h("p", {}, "Turn a folder or file of standards (.md, .txt, .mdc, .cursorrules) into rules (train.py)."),
    h("div", { class: "fields" },
      field("Folder or file", textInput(T.train, "path", { placeholder: "~/docs/team-standards", label: "Folder or file" })),
      field("Force one scope (optional)", textInput(T.train, "scope", { placeholder: "global · section:api · glob:**/*.py", label: "Scope" }))),
    h("div", { class: "row" }, checkbox(T.train, "pending", "Import as pending"), checkbox(T.train, "dryRun", "Dry run (preview only)"),
      h("span", { style: "flex:1" }),
      h("button", { class: "btn primary", disabled: !enabled(T.train), onclick: guard(() => runTool(T.train, "train", T.train.v)) }, "Run")),
    outputBox(T.train));

  const pathsBox = h("textarea", { class: "mono", rows: "3", spellcheck: "false", placeholder: "src/api/users.py" });
  pathsBox.value = T.resolve.v.paths; pathsBox.addEventListener("input", () => (T.resolve.v.paths = pathsBox.value));
  const resolve = h("section", { class: "tool" },
    h("h3", {}, "What will the agent see?"), h("p", {}, "The exact rules handed to the agent for these files (review.py resolve). One path per line, relative to the project or absolute."),
    field("Files", pathsBox),
    h("div", { class: "row" }, h("button", { class: "btn primary", disabled: !enabled(T.resolve),
      onclick: guard(() => runTool(T.resolve, "resolve", { paths: T.resolve.v.paths.split("\n").map((s) => s.trim()).filter(Boolean) })) }, "Show rules")),
    outputBox(T.resolve));

  const P = T.project;
  const project = h("section", { class: "tool" },
    h("h3", {}, "Project"), h("p", {}, "Housekeeping scripts for this project."),
    h("div", { class: "row" },
      h("button", { class: "btn", disabled: !enabled(P), onclick: guard(() => runTool(P, "remap", {})) }, "Re-map project (memorize.py)"),
      h("button", { class: "btn warn" + (state.sure === "sync" ? " sure" : ""), disabled: !enabled(P),
        title: "Writes .github/instructions/lore-*.instructions.md into the project folder",
        onclick: twoStep("sync", () => runTool(P, "sync", {})) },
        state.sure === "sync" ? "Write files into the project?" : "Export to Copilot files (review.py sync)"),
      h("button", { class: "btn", disabled: !enabled(P), onclick: guard(() => runTool(P, "mcp-check", {})) }, "Check MCP server (mcp_server.py)")),
    outputBox(P));

  $("list").replaceChildren(discover, train, resolve, project);
}

function renderRegister() {
  const R = state.register;
  $("head").replaceChildren(h("h1", {}, "Add project")); $("tabs").replaceChildren(); $("bar").replaceChildren();
  const run = guard(async () => {
    R.running = true; R.out = null; renderMain();
    try { R.out = await api("POST", "/api/projects", { path: R.v.path, name: R.v.name, noImport: R.v.noImport }); }
    catch (e) { R.out = { ok: false, code: -1, command: "", output: e.message, seconds: 0 }; }
    R.running = false;
    if (R.out.ok) {
      const name = R.out.name; R.out = null; R.v.path = ""; R.v.name = "";
      toast(`Registered ${name}`, true);
      state.projects = await api("GET", "/api/projects");
      return select(name);
    }
    renderMain();
  });
  $("list").replaceChildren(h("section", { class: "form" },
    h("h2", {}, "Register a project"),
    h("p", {}, "Maps the project folder (memorize.py) so lore can scope rules to its sections. Existing instruction files such as AGENTS.md are imported as rules."),
    field("Project folder", textInput(R, "path", { placeholder: "~/projects/myapp", label: "Project folder" })),
    field("Name (optional, defaults to the folder name)", textInput(R, "name", { placeholder: "myapp", label: "Name" })),
    h("div", { class: "row" }, checkbox(R, "noImport", "Don't import existing instruction files"), h("span", { style: "flex:1" }),
      h("button", { class: "btn primary", disabled: R.running, onclick: run }, "Register")),
    outputBox(R)));
}

function renderEmpty() {
  $("head").replaceChildren(); $("tabs").replaceChildren(); $("bar").replaceChildren();
  let msg;
  if (!token) msg = [h("p", {}, "Open the address printed by "), h("code", {}, "serve.py"), " — it contains the access token."];
  else if (!state.projects.length) msg = [h("p", {}, "No projects yet."), h("p", {}, "Use “+ Add project” on the left to register one.")];
  else msg = [h("p", {}, "Select a project.")];
  $("list").replaceChildren(h("div", { class: "empty" }, ...msg));
}

guard(async () => { if (!token) return renderEmpty(); await loadProjects(); if (!state.current) { renderSide(); renderEmpty(); } })();
</script>
</body>
</html>
